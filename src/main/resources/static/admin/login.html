<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>后台登录 - 外卖管理系统</title>
  <link rel="stylesheet" href="/common.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <h2>外卖管理系统 · 后台登录</h2>
      <div class="form-item">
        <label>用户名</label>
        <input id="username" placeholder="请输入用户名" value="admin">
      </div>
      <div class="form-item">
        <label>密码</label>
        <input id="password" type="password" placeholder="请输入密码" value="123456">
      </div>
      <button class="btn" style="width:100%" onclick="login()">登 录</button>
      <p class="muted" style="margin-top:12px;text-align:center">测试账号：admin / 123456</p>
    </div>
  </div>
  <script src="/common.js"></script>
  <script>
    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!username || !password) { alert('请输入用户名和密码'); return; }
      await post('/employee/login', { username, password });
      location.href = '/admin/index.html';
    }
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
