<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>套餐管理</title>
  <link rel="stylesheet" href="/common.css">
</head>
<body>
  <div class="card">
    <div class="topbar"><h3>套餐管理</h3></div>
    <div class="toolbar">
      <input id="nameFilter" placeholder="套餐名称" onkeydown="if(event.key==='Enter')loadList()">
      <select id="categoryFilter"><option value="">全部分类</option></select>
      <select id="statusFilter">
        <option value="">全部状态</option>
        <option value="1">启售</option>
        <option value="0">停售</option>
      </select>
      <button class="btn" onclick="loadList()">查询</button>
      <button class="btn btn-green" onclick="openAdd()">新增套餐</button>
    </div>
    <table>
      <thead>
        <tr><th>ID</th><th>套餐名称</th><th>所属分类</th><th>价格(元)</th><th>描述</th><th>状态</th><th>操作</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center;">
    <div class="card" style="width:420px;max-height:85vh;overflow:auto">
      <h3 id="modalTitle" style="margin-bottom:16px">新增套餐</h3>
      <div class="form-item"><label>套餐名称</label><input id="name"></div>
      <div class="form-item"><label>所属分类</label><select id="categoryId"></select></div>
      <div class="form-item"><label>价格(元)</label><input id="price" type="number" step="0.01" min="0"></div>
      <div class="form-item"><label>描述</label><textarea id="description" rows="2"></textarea></div>
      <div class="form-item">
        <label>套餐包含菜品</label>
        <div id="dishChecks" style="max-height:140px;overflow:auto;border:1px solid #eee;border-radius:6px;padding:8px;"></div>
      </div>
      <div class="row">
        <button class="btn" onclick="save()">保存</button>
        <button class="btn btn-plain" onclick="closeModal()">取消</button>
      </div>
    </div>
  </div>

  <script src="/common.js"></script>
  <script>
    let editId = null;
    let allDishes = [];

    async function loadCategories() {
      const list = await request('/category/list?type=2');
      const opts = list.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      document.getElementById('categoryFilter').innerHTML = '<option value="">全部分类</option>' + opts;
      document.getElementById('categoryId').innerHTML = opts;
    }

    async function loadDishes() {
      allDishes = await request('/dish/list?status=1');
      document.getElementById('dishChecks').innerHTML = allDishes.map(d => `
        <label style="display:block;padding:4px 0;font-size:14px">
          <input type="checkbox" value="${d.id}" data-name="${d.name}" data-price="${d.price}"> ${d.name}（¥${fmtMoney(d.price)}）
        </label>`).join('');
    }

    async function loadList() {
      const name = document.getElementById('nameFilter').value.trim();
      const categoryId = document.getElementById('categoryFilter').value;
      const status = document.getElementById('statusFilter').value;
      const list = await request(`/setmeal/list?name=${name}&categoryId=${categoryId}&status=${status}`);
      document.getElementById('tbody').innerHTML = list.map(s => `
        <tr>
          <td>${s.id}</td>
          <td>${s.name}</td>
          <td>${s.categoryName || '-'}</td>
          <td>${fmtMoney(s.price)}</td>
          <td>${s.description || ''}</td>
          <td><span class="tag ${s.status === 1 ? 'tag-on' : 'tag-off'}">${s.status === 1 ? '启售' : '停售'}</span></td>
          <td>
            <button class="btn btn-sm" onclick='openEdit(${JSON.stringify(s)})'>修改</button>
            <button class="btn btn-sm ${s.status === 1 ? 'btn-gray' : 'btn-green'}" onclick="toggleStatus(${s.id},${s.status})">${s.status === 1 ? '停售' : '启售'}</button>
            <button class="btn btn-sm btn-plain" onclick="remove(${s.id})">删除</button>
          </td>
        </tr>`).join('');
    }

    function openAdd() {
      editId = null;
      document.getElementById('modalTitle').innerText = '新增套餐';
      document.getElementById('name').value = '';
      document.getElementById('categoryId').value = '';
      document.getElementById('price').value = '';
      document.getElementById('description').value = '';
      document.querySelectorAll('#dishChecks input').forEach(i => i.checked = false);
      document.getElementById('modal').style.display = 'flex';
    }

    async function openEdit(s) {
      editId = s.id;
      document.getElementById('modalTitle').innerText = '修改套餐';
      document.getElementById('name').value = s.name;
      document.getElementById('categoryId').value = s.categoryId;
      document.getElementById('price').value = s.price;
      document.getElementById('description').value = s.description || '';
      const detail = await request(`/setmeal/${s.id}`);
      const picked = (detail.setmealDishes || []).map(d => d.dishId);
      document.querySelectorAll('#dishChecks input').forEach(i => i.checked = picked.includes(Number(i.value)));
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    function collectDishes() {
      const boxes = document.querySelectorAll('#dishChecks input:checked');
      return Array.from(boxes).map(b => ({
        dishId: Number(b.value),
        name: b.dataset.name,
        price: Number(b.dataset.price),
        copies: 1
      }));
    }

    async function save() {
      const body = {
        name: document.getElementById('name').value.trim(),
        categoryId: Number(document.getElementById('categoryId').value),
        price: document.getElementById('price').value,
        description: document.getElementById('description').value.trim(),
        setmealDishes: collectDishes()
      };
      if (!body.name || !body.categoryId || !body.price) { alert('请填写完整套餐信息'); return; }
      if (editId) body.id = editId;
      if (editId) await put('/setmeal', body); else await post('/setmeal', body);
      closeModal();
      loadList();
    }

    async function toggleStatus(id, status) {
      const target = status === 1 ? 0 : 1;
      await request(`/setmeal/status/${target}?id=${id}`, { method: 'PUT' });
      loadList();
    }

    async function remove(id) {
      if (!confirm('确定删除该套餐吗？')) return;
      await del(`/setmeal/${id}`);
      loadList();
    }

    loadCategories().then(loadDishes).then(loadList);
  </script>
</body>
</html>
