<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>用户登录 - 外卖系统</title>
  <link rel="stylesheet" href="/common.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <h2>用户登录</h2>
      <div class="form-item">
        <label>手机号</label>
        <input id="phone" placeholder="请输入手机号" value="13900000000">
      </div>
      <div class="form-item">
        <label>验证码</label>
        <div style="display:flex;gap:8px">
          <input id="code" placeholder="请输入验证码">
          <button class="btn btn-plain" id="sendBtn" onclick="sendMsg()">获取验证码</button>
        </div>
      </div>
      <button class="btn" style="width:100%" onclick="login()">登 录</button>
      <p class="muted" style="margin-top:12px;text-align:center">演示账号：13900000000，验证码点击按钮后见弹窗 / 后端控制台</p>
    </div>
  </div>
  <script src="/common.js"></script>
  <script>
    let countdown = 0;
    async function sendMsg() {
      const phone = document.getElementById('phone').value.trim();
      if (phone.length !== 11) { alert('请输入正确的11位手机号'); return; }
      const code = await post('/user/sendMsg', { phone });
      alert('您的验证码是：' + code + '（演示环境直接返回，生产环境走短信）');
      document.getElementById('code').value = code || '';
      const btn = document.getElementById('sendBtn');
      countdown = 60;
      btn.disabled = true;
      const timer = setInterval(() => {
        countdown--;
        btn.innerText = countdown + 's 后重发';
        if (countdown <= 0) { clearInterval(timer); btn.disabled = false; btn.innerText = '获取验证码'; }
      }, 1000);
    }

    async function login() {
      const phone = document.getElementById('phone').value.trim();
      const code = document.getElementById('code').value.trim();
      if (!phone || !code) { alert('请填写手机号和验证码'); return; }
      await post('/user/login', { phone, code });
      location.href = '/user/index.html';
    }
  </script>
</body>
</html>
