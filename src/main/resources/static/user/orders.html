<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>我的订单</title>
  <link rel="stylesheet" href="/common.css">
</head>
<body>
  <header class="user-header">
    <h3>我的订单</h3>
    <nav style="display:flex;gap:16px;font-size:14px">
      <a href="/user/index.html">首页</a>
      <a href="/user/cart.html">购物车</a>
      <a href="/user/orders.html">我的订单</a>
      <a href="/user/address.html">地址管理</a>
      <a href="javascript:logout()">退出</a>
    </nav>
  </header>

  <div class="card" style="margin:20px" id="orderList"></div>

  <script src="/common.js"></script>
  <script>
    const statusMap = { 1: '待付款', 2: '待派送', 3: '已派送', 4: '已完成', 5: '已取消' };

    async function loadList() {
      const list = await request('/user/order/list');
      const box = document.getElementById('orderList');
      if (!list.length) { box.innerHTML = '<p class="muted">暂无订单</p>'; return; }
      box.innerHTML = list.map(o => `
        <div style="border-bottom:1px solid #eee;padding:14px 0">
          <div class="row">
            <span class="muted">订单号：${o.number}</span>
            <span class="tag tag-on">${statusMap[o.status]}</span>
          </div>
          <div style="margin:8px 0">
            ${(o.orderDetails || []).map(d => `${d.name} × ${d.number}`).join('，')}
          </div>
          <div class="row">
            <span class="muted">${o.consignee} ${o.phone}　${fmtTime(o.createTime)}</span>
            <span class="price" style="color:#ff5e3a">¥${fmtMoney(o.amount)}</span>
          </div>
        </div>`).join('');
    }

    async function logout() {
      await post('/user/logout', {});
      location.href = '/user/login.html';
    }

    loadList();
  </script>
</body>
</html>
